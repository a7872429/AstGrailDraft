button{font:inherit} .app{max-width:1150px;margin:auto;padding:28px 18px 60px} header{text-align:center;margin-bottom:22px}

.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap} .round{font-size:22px;font-weight:950} .round span{color:var(--gold2)} .small{color:var(--muted);font-size:13px}
.offer-title{text-align:center;margin:25px 0 15px;color:var(--gold2);font-weight:900} .offers{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}

.name{font-weight:950;text-align:center;margin-top:8px} .stat{font-size:11px;color:#aeb9d8;text-align:center;margin-top:5px} .pickmark{position:absolute;right:8px;top:8px;display:none;background:var(--gold);color:#241b08;border-radius:50%;width:25px;height:25px;place-items:center;font-weight:1000} .selected .pickmark{display:grid}

.mini{width:74px;height:74px;border-radius:50%;overflow:hidden;margin:auto;border:2px solid #6576a3} .num{color:var(--gold);font-size:12px;font-weight:950} .sname{font-size:17px;font-weight:950;margin-top:6px} .instruction{text-align:center;min-height:28px;color:var(--gold2);font-weight:800;margin-top:17px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:18px} .btn{border:0;border-radius:13px;padding:12px 22px;font-weight:950;cursor:pointer} .primary{background:linear-gradient(180deg,#ffe0a0,#dcae50);color:#231a08} .secondary{background:#263556;color:#f3f6ff;border:1px solid #50618d} .hidden{display:none!important}
.final-team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px auto;max-width:680px} .final-card{border:1px solid #394b74;border-radius:15px;padding:11px;background:#151f3c;text-align:center} .final-card img{width:70px;height:70px;border-radius:50%;border:2px solid #697ba7}
.score-ring{width:190px;height:190px;border-radius:50%;margin:20px auto 14px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--gold) var(--pct),#24304d 0)} .score-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#101936} .score-number{position:relative;z-index:2;font-size:50px;font-weight:1000;color:var(--gold2)} .score-number small{font-size:19px;color:var(--muted)} .grade{font-size:28px;font-weight:1000;text-align:center} .feedback{max-width:720px;margin:10px auto;color:#c4cdec;line-height:1.7;text-align:center}

@media(max-width:760px){.offers{grid-template-columns:repeat(2,1fr)}.offers .card:last-child{grid-column:1/-1;max-width:50%;width:100%;justify-self:center}.seats,.final-team{grid-template-columns:1fr}}

.team-choice{display:flex;justify-content:center;gap:14px;margin:20px 0 6px;flex-wrap:wrap}
.team-btn{min-width:150px;padding:13px 24px;border-radius:14px;border:2px solid transparent;font-weight:950;cursor:pointer;color:#fff;transition:.16s}
.team-btn.red{background:linear-gradient(180deg,#7b2331,#43131d);border-color:#a94555}
.team-btn.blue{background:linear-gradient(180deg,#244d85,#122b50);border-color:#4d75ad}

.team-btn.red.active{border-color:#ff8b9e}.team-btn.blue.active{border-color:#79b6ff}
.team-note{text-align:center;color:#97a5c7;font-size:12px;margin-top:7px}
.table-wrap{margin-top:22px}.table-label{text-align:center;font-weight:900;color:var(--gold2);margin-bottom:12px}
.seat-map{position:relative;width:min(760px,92vw);aspect-ratio:1.18/1;margin:0 auto 26px}

.map-seat{position:absolute;width:118px;min-height:118px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid;box-shadow:0 10px 24px rgba(0,0,0,.28);padding:8px;z-index:2}
.map-seat.red{background:linear-gradient(180deg,#762536,#40141e);border-color:#cf6677}
.map-seat.blue{background:linear-gradient(180deg,#26558f,#132e56);border-color:#6697d2}
.map-seat.mine{box-shadow:0 0 0 5px rgba(231,189,99,.25),0 10px 24px rgba(0,0,0,.3);border-color:var(--gold)}
.map-seat.available{cursor:pointer;animation:pulseSeat 1.5s ease-in-out infinite}.map-seat.available:hover{filter:brightness(1.15)}
.map-seat .seat-avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;margin:0 auto 3px;border:2px solid rgba(255,255,255,.6)}
.map-seat .seat-avatar img{width:100%;height:100%;object-fit:cover}

const scoreCalibrationAnchors=[[46.008645, 30], [54.615014, 40], [61.589685, 67], [69.205287, 92], [78.463127, 99]];
function calibrateScore(raw){
  const a=scoreCalibrationAnchors;
  if(raw<=a[0][0]) return a[0][1];
  for(let i=0;i<a.length-1;i++){
    const [x0,y0]=a[i], [x1,y1]=a[i+1];
    if(raw<=x1){
      const t=(raw-x0)/(x1-x0 || 1);
      return y0+t*(y1-y0);
    }
  }
  return 99;
}


// 正式規則：每次重新構築有 0.5% 機率進入錯字彩蛋。
const TYPO_EASTER_EGG_RATE=0.005;
let typoRouteActive=false,typoRouteStage=0,typoWrongNames={};
const typoRules=[["士","土"],["師","帥"],["家","冢"],["者","耆"]];
function makeTypoName(name){
 if(name==="記錄者")return null;
 for(const [from,to] of typoRules){if(name.includes(from))return name.replace(from,to);}return null;
}
function beginTypoRoute(){typoRouteActive=Math.random()<TYPO_EASTER_EGG_RATE;typoRouteStage=typoRouteActive?1:0;typoWrongNames={};}
function injectTypoOffers(offers){
 if(!typoRouteActive||!(round===1||round===2))return offers;
 const eligible=characters.filter(c=>!seats.some(s=>s&&s.id===c.id)&&!used.has(c.id)&&c.name!=="記錄者"&&makeTypoName(c.name));
 if(!eligible.length)return offers;
 const c=eligible[Math.floor(Math.random()*eligible.length)];
 let out=offers.filter(x=>x.id!==c.id).slice(0,4);out.push(c);out.sort(()=>Math.random()-.5);typoWrongNames[c.id]=makeTypoName(c.name);return out;
}
function injectRecorderOffer(offers){
 if(!typoRouteActive||typoRouteStage!==3||round!==3)return offers;
 const rec=characters.find(c=>c.name==="記錄者");if(!rec)return offers;
 let out=offers.filter(x=>x.id!==rec.id).slice(0,4);out.push(rec);out.sort(()=>Math.random()-.5);return out;
}
function displayRoleName(c){return typoWrongNames[c.id]||c.name;}
function registerTypoPick(c){
 if(!typoRouteActive)return;
 if(round===1){if(typoWrongNames[c.id])typoRouteStage=2;else{typoRouteActive=false;typoRouteStage=0;}}
 else if(round===2){if(typoRouteStage===2&&typoWrongNames[c.id])typoRouteStage=3;else{typoRouteActive=false;typoRouteStage=0;}}

}

 return"utility";

const displayScoreAnchors=[[50.770204, 30], [57.909956, 40], [60.285189, 50], [62.585152, 60], [64.926986, 70], [67.368752, 80], [69.842761, 90], [72.773658, 95], [84.410527, 95]];
function calibrateDisplayScore(raw){
  const a=displayScoreAnchors;
  if(raw<=a[0][0]) return a[0][1];
  for(let i=0;i<a.length-1;i++){
    const [x0,y0]=a[i], [x1,y1]=a[i+1];
    if(raw<=x1){
      if(y0===y1) return y0;
      const t=(raw-x0)/(x1-x0 || 1);
      return y0+t*(y1-y0);
    }
  }
  return 95;
}

function calc(){
 let types=seats.map(roleType);

 // 1) 角色強度：角色基礎數據 + 去年賽事表現。
 // 「公認強角」不再直接加最終總分，只在角色強度內做小幅修正。
 let individual=seats.reduce((s,c)=>{
   let base=(c.base*.68+c.tour*.32);
   let mult=strongRoleMult[c.name]||1;
   let strongAdj=(mult-1)*25; // 1.05≈+1.25、1.10≈+2.5，三人平均後仍是小修正
   return s+base+strongAdj;
 },0)/3;
 individual=clamp(individual,30,100);

 // 2) 實際賽事中的同隊搭配。
 let pairScores=[];
 for(let i=0;i<3;i++) for(let j=i+1;j<3;j++){
   let a=seats[i].name,b=seats[j].name;
   let key=[a,b].sort().join("|"), d=tournamentPairs[key];
   if(!d){ pairScores.push(58); continue; }
   let wr=(d.w+2)/(d.g+4);
   let confidence=Math.min(1,d.g/7);
   pairScores.push(58 + (wr-.5)*72*confidence);
 }
 let tournamentSynergy=pairScores.reduce((a,b)=>a+b,0)/pairScores.length;

 // 3) 使用者提供的二人 / 三人組合加乘。
 // 這些資料只影響「組合搭配」，不再另外直接推高最終總分。
 let manualBonus=0;
 for(let i=0;i<3;i++) for(let j=i+1;j<3;j++){
   let key=[seats[i].name,seats[j].name].sort().join("|");
   let mult=manualPairMult[key];
   if(mult) manualBonus+=(mult-1)*42;
 }
 let tripleKey=seats.map(c=>c.name).sort().join("|");
 if(manualTripleMult[tripleKey]) manualBonus+=(manualTripleMult[tripleKey]-1)*55;

 // 神聖教廷多人同隊：保留小幅組合加成。
 let holyCount=seats.filter(c=>holyCourt.has(c.name)).length;
 if(holyCount>=2) manualBonus+=(holyCount-1)*4;

 let synergy=clamp(tournamentSynergy + manualBonus,30,100);

 // 4) 真正的前後座概念：
 // 紅隊：紅2 = 前、紅3 = 中、紅1 = 後
 // 藍隊：藍1 = 前、藍2 = 中、藍3 = 後
 function actualPosition(index){
   if(teamChoice==="red"){
     return index===1 ? "前" : index===0 ? "後" : "中";
   }else{
     return index===0 ? "前" : index===2 ? "後" : "中";
   }
 }

 let posValues=[];
 seats.forEach((c,i)=>{
   let pref=positionPreference[c.name]||"沒差";
   let actual=actualPosition(i);
   if(pref==="沒差") posValues.push(72);
   else if(pref===actual) posValues.push(100);
   else if(actual==="中") posValues.push(66);
   else posValues.push(38);
 });
 let pos=posValues.reduce((a,b)=>a+b,0)/3;

 // 5) 功能互補。
 let unique=new Set(types).size;
 let comp = unique===3 ? 88 : unique===2 ? 68 : 45;
 if(types.includes("support")) comp+=4;
 if(types.includes("front")) comp+=3;
 if(types.includes("ranged")) comp+=3;
 comp=clamp(comp,40,100);

 // 新核心：組合搭配成為最重要的一項。
 let total =
   individual*0.35 +
   synergy*0.45 +
   comp*0.10 +
   pos*0.10;

 // 1.3：三個角色必殺技全部吃寶石，略微扣分。
 if(seats.every(c=>gemUltimateRoles.has(c.name))) total*=0.95;

 // 1.3：資源供需只作很小的修正。
 let producers=seats.filter(c=>resourceRole[c.name]==="產資源").length;
 let consumers=seats.filter(c=>resourceRole[c.name]==="吃資源").length;
 let resourceDiff=producers-consumers;
 let resourceMult=resourceDiff>=2?1.02:resourceDiff===1?1.01:resourceDiff===0?1:resourceDiff===-1?0.99:0.98;
 total*=resourceMult;

 // 頂分門檻：沒有足夠的角色搭配，就不能只靠三個強角衝到頂分。
 if(synergy<60) total=Math.min(total,79);
 else if(synergy<70) total=Math.min(total,89);
 else if(synergy<85) total=Math.min(total,94);
 else if(synergy<92) total=Math.min(total,97);

 const rawTotal=total;
 total=Math.round(clamp(calibrateDisplayScore(rawTotal),30,95));

 return{
  individual:Math.round(individual),
  synergy:Math.round(synergy),
  comp:Math.round(comp),
  pos:Math.round(pos),
  rawTotal,
  total
 };
}

   if(c.name!==favoriteName && roleType(c)===favType) bonus+=1.5;
   if(c.name!==favoriteName){
     const key=[favoriteName,c.name].sort().join("|");
     const mult=manualPairMult[key];
     if(mult>=1.10) bonus+=2;

   }
 });

}

 let theory=base, favBonus=0, luck=0;
 if(base>=90){
   favBonus=favoriteBonus();
   luck=nameLuck;
   theory=base+favBonus+luck;
 }
 const privileged=isFixed99Lineup()||isChampionLineup();
 let finalScore=Math.round(theory);
 let hitWall=false;
 if(privileged){
   finalScore=Math.min(99,Math.max(0,finalScore));
   if(isFixed99Lineup()) finalScore=99;
 }else{
   if(finalScore>98){finalScore=98;hitWall=true;}
   finalScore=Math.max(0,finalScore);
 }
 s.baseBeforePersonal=base;s.favoriteBonus=favBonus;s.nameLuck=luck;s.theoretical=theory;s.hitHistoryWall=hitWall;s.total=finalScore;
 return s;
}

function roundRect(ctx,x,y,w,h,r,fill,stroke,lineWidth=1){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lineWidth;ctx.strokeStyle=stroke;ctx.stroke();}
}
function drawCenteredText(ctx,text,x,y,font,color){
  ctx.font=font;ctx.fillStyle=color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,x,y);
}
function fitText(ctx,text,maxWidth,startSize,minSize=14,weight=800){
  let size=startSize;
  while(size>minSize){
    ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif`;
    if(ctx.measureText(text).width<=maxWidth)break;
    size--;
  }
  return `${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif`;
}
function wrapText(ctx,text,maxWidth){
  const chars=[...text], lines=[]; let line="";
  for(const ch of chars){
    const test=line+ch;
    if(line && ctx.measureText(test).width>maxWidth){lines.push(line);line=ch;} else line=test;
  }
  if(line)lines.push(line);
  return lines;
}


function imageProxyURL(url){ return url; }

function loadCanvasSafeImage(url){
  return new Promise(resolve=>{
    if(!url){resolve(null);return;}

    const tryLoad=(src,allowFallback)=>{
      const img=new Image();
      if(/^https?:/i.test(src)) img.crossOrigin="anonymous";
      img.onload=()=>{
        // Test in a temporary canvas first. If this canvas becomes tainted,
        // do not contaminate the final result canvas.
        try{
          const t=document.createElement("canvas");
          t.width=4;t.height=4;
          const tc=t.getContext("2d");
          tc.drawImage(img,0,0,4,4);
          t.toDataURL("image/png");
          resolve(img);
        }catch(err){
          if(allowFallback) tryLoad(imageProxyURL(url),false);
          else resolve(null);
        }
      };
      img.onerror=()=>{
        if(allowFallback) tryLoad(imageProxyURL(url),false);
        else resolve(null);
      };
      img.src=src;
    };

    tryLoad(url,true);
  });
}

function drawCircularImage(ctx,img,cx,cy,r){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  const sw=img.naturalWidth||img.width;
  const sh=img.naturalHeight||img.height;
  const scale=Math.max((r*2)/sw,(r*2)/sh);
  const dw=sw*scale, dh=sh*scale;
  ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth=3;
  ctx.strokeStyle="#687aa7";
  ctx.stroke();
}

      const cardStroke=teamChoice==="red"?"#b64b5b":"#3e73b6";
      roundRect(ctx,x,y,cardW,cardH,18,cardFill,cardStroke,1.8);
      drawCenteredText(ctx,labels[i],x+cardW/2,y+22,'1000 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif',"#f0c75b");

      // Draw the actual avatar when it can be exported safely.
      const avatar=safeAvatars[i];
      if(avatar){
        drawCircularImage(ctx,avatar,x+cardW/2,y+68,34);
        ctx.beginPath();ctx.arc(x+cardW/2,y+68,35.5,0,Math.PI*2);
        ctx.lineWidth=2.5;ctx.strokeStyle=teamChoice==="red"?"#d46a75":"#5b8fce";ctx.stroke();
      }else{
        ctx.beginPath(); ctx.arc(x+cardW/2,y+68,34,0,Math.PI*2);
        ctx.fillStyle="#26385f"; ctx.fill();
        ctx.lineWidth=3; ctx.strokeStyle="#687aa7"; ctx.stroke();
        drawCenteredText(ctx,c.name.slice(0,1),x+cardW/2,y+68,'900 29px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif',"#ffe0a0");
      }

      drawCenteredText(ctx,c.name,x+cardW/2,y+119,fitText(ctx,c.name,cardW-24,20,13,900),"#f7f8ff");
    });

    // Score ring
    const cx=W/2, cy=555, r=90;
    ctx.lineWidth=14; ctx.strokeStyle="#263553";
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

    ctx.strokeStyle="#e7bd63";
    ctx.beginPath();
    ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*(lastResult.score/100));
    ctx.stroke();

    // Center the whole "95/100" group inside the ring instead of
    // centering only the large score and appending /100 to the right.
    const scoreText=String(lastResult.score);
    const suffixText="/100";
    const scoreFont='1000 58px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    const suffixFont='700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

    ctx.textBaseline="middle";
    ctx.textAlign="left";

    ctx.font=scoreFont;
    const scoreW=ctx.measureText(scoreText).width;
    ctx.font=suffixFont;
    const suffixW=ctx.measureText(suffixText).width;

    const textGap=5;
    const totalTextW=scoreW+textGap+suffixW;
    const scoreStartX=cx-totalTextW/2;

    ctx.font=scoreFont;
    ctx.fillStyle="#ffe0a0";
    ctx.fillText(scoreText,scoreStartX,cy-3);

    ctx.font=suffixFont;
    ctx.fillStyle="#9da9ca";
    ctx.fillText(suffixText,scoreStartX+scoreW+textGap,cy+8);

    drawCenteredText(ctx,lastResult.grade,cx,685,'1000 31px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif',"#f7f8ff");

    ctx.font='500 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif';
    const commentLines=wrapText(ctx,lastResult.comment,720).slice(0,3);
    ctx.fillStyle="#c7d0ea";ctx.textAlign="center";ctx.textBaseline="middle";
    commentLines.forEach((line,i)=>ctx.fillText(line,cx,730+i*28));
    const bondText=bondDialogueForCurrentLineup();
    if(bondText){
      ctx.font='500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif';
      ctx.fillStyle="#8795b8";
      const bondLines=wrapText(ctx,bondText,760).slice(0,2);
      bondLines.forEach((line,i)=>ctx.fillText(line,cx,790+i*19));
    }

    // Breakdown bars
    const calcData=applySpecialScore(calc());

    const rows=[
      ["角色強度",calcData.individual],
      ["組合搭配",calcData.synergy],
      ["陣容互補",calcData.comp],
      ["座次適性",calcData.pos]
    ];
    const barX=390, barW=430, barY=820;
    rows.forEach((row,i)=>{
      const y=barY+i*46;
      ctx.font='800 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif';
      ctx.fillStyle="#f7f8ff";ctx.textAlign="right";ctx.textBaseline="middle";
      ctx.fillText(row[0],350,y);
      roundRect(ctx,barX,y-7,barW,14,7,"#253552",null);
      const grad=ctx.createLinearGradient(barX,0,barX+barW,0);
      grad.addColorStop(0,"#aebbd5");grad.addColorStop(1,"#e7bd63");
      roundRect(ctx,barX,y-7,barW*Math.max(0,Math.min(100,row[1]))/100,14,7,grad,null);
      ctx.textAlign="left";ctx.fillStyle="#f7f8ff";ctx.fillText(String(row[1]),barX+barW+18,y);
    });

    drawCenteredText(ctx,"ASTERIATED GRAIL · LINEUP CHALLENGE · v24",W/2,1015,'700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',"#7380a3");

    // Save as JPG.
    const side=teamChoice==="red"?"紅方":"藍方";
    const filename=`Asteriated_Grail_陣容構築_${side}_${lastResult.score}分.jpg`;
    const url=canvas.toDataURL("image/jpeg",0.94);
    const a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
  }catch(err){
    console.error(err);
    alert("儲存圖片失敗："+(err&&err.message?err.message:"未知錯誤"));
  }finally{
    btn.disabled=false;
    btn.textContent="儲存圖片";
  }
}

function startTeam(team){
 teamChoice=team;round=1;seats=[null,null,null];picked=null;used=new Set();draftHistory=[];currentOffers=sampleFive();
 if($("roundNo"))$("roundNo").textContent=1;$("instruction").textContent="先選一位角色。";
 $("draftArea").classList.remove("hidden");renderOffers();renderSeats();
}
function randomStart(){
 round=1;seats=[null,null,null];picked=null;used=new Set();teamChoice=null;
 beginTypoRoute();
 $("gamePanel").classList.remove("hidden");$("resultPanel").classList.add("hidden");
 $("teamSetup").classList.remove("hidden");$("draftArea").classList.add("hidden");
 const team=Math.random()<0.5?"red":"blue";
 const label=team==="red"?"紅方":"藍方";
 const el=$("randomTeamResult");
 el.textContent="抽選中…";
 el.style.color="var(--gold2)";
 setTimeout(()=>{
   el.textContent=`本次選擇為${label}`;
   el.style.color=team==="red"?"#ff8799":"#7db7ff";
   setTimeout(()=>{
     $("teamSetup").classList.add("hidden");
     startTeam(team);
   },1100);
 },650);
}
$("downloadShareBtn").onclick=saveResultJPG;
$("restartBtn").onclick=resetProfile;
$("againBtn").onclick=randomStart;
$("newProfileBtn").onclick=resetProfile;
$("profileStartBtn").onclick=startProfileGame;
renderFavoriteGrid();
</script>
